<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Serviço - Sistema de Frota</title>
  <link rel="stylesheet" href="css/servico_style.css" />
</head>
<body>
  <header>
    <h1>Cadastro de Serviço</h1>
    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="cadastro.html">Cadastro</a></li>
        <li><a href="orcamento.html">Orçamento</a></li>
        <li><a href="servico.html" class="ativo">Serviço</a></li>
        <li><a href="listas.html">Listagens</a></li>
        <li><a href="relatorio.html">Relatório</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="formulario-servico">
      <h2>Dados do Serviço</h2>
      <form action="../servico" method="post">
        
        <div class="form-grupo">
          <label for="tipoServico">Tipo de Serviço:</label>
          <select name="tipoServico" required>
            <option value="">Selecione</option>
            <option value="Entrega Rápida">Entrega Rápida</option>
            <option value="Entrega Padrão">Entrega Padrão</option>
            <option value="Mudança">Mudança</option>
          </select>
        </div>
    
        <div class="linha">
          <div class="form-grupo">
            <label for="localOrigem">Origem:</label>
            <input type="text" name="localOrigem" required>
          </div>
          <div class="form-grupo">
            <label for="localDestino">Destino:</label>
            <input type="text" name="localDestino" required>
          </div>
        </div>
    
        <div class="linha">
          <div class="form-grupo">
            <label for="distancia">Distância (km):</label>
            <input type="number" step="0.1" name="distancia" required>
          </div>
          <div class="form-grupo">
            <label for="dataExecucao">Data:</label>
            <input type="date" name="dataExecucao" required>
          </div>
        </div>
    
        <div class="form-grupo">
          <label for="idTransportador">ID do Transportador:</label>
          <input type="number" name="idTransportador" required>
        </div>
    
        <div class="linha">
          <div class="form-grupo">
            <label for="idMotorista">Motorista:</label>
            <select name="idMotorista" required>
              <option value="">Selecione</option>
            </select>
          </div>
          <div class="form-grupo">
            <label for="idCaminhao">Caminhão:</label>
            <select name="idCaminhao" required>
              <option value="">Selecione</option>
            </select>
          </div>
        </div>
    
        <button type="submit">Cadastrar Serviço</button>
      </form>
    </section>
    
  </main>

  <footer>
    <p>&copy; 2025 - Sistema de Frota</p>
  </footer>
</body>
</html>
